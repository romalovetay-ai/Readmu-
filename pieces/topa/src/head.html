<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Топа и шарик</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1714; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { max-width: 100vw; max-height: 100vh; width: auto; height: auto; display: block; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
"use strict";
// =====================================================================
//  ТОПА И ШАРИК — 16:9, ~63s @ 120 BPM, 24fps. A mission (F4): the bear's balloon flies into a tree; the rabbit
//  and the hedgehog try and fail, the bird brings it back. One meadow, many framings: every shot draws the same
//  world (src/scenes.js) at its own time, and pieceCam() (src/bridges.js) frames it. All cuts are hard, on the 8th grid.
//  The voice is the clock: every event below is cued from VOICE (voice.json, injected by build.mjs).
// =====================================================================
const FORMAT = '16:9', FPS = 24, W = 1920, H = 1080;
const BPM = 120, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4, GRID0 = 0;
const SAFE = { top: 60, bottom: 110, right: 60 };
const HAND = '"Comic Sans MS", "Comic Neue", "Inter", "DejaVu Sans", sans-serif';   // Cyrillic-capable, rounded first
const CX = W / 2;
const onBeat = (t) => +(GRID0 + Math.round((t - GRID0) / E8) * E8).toFixed(4);

// ---- the voice
const VL = (id) => VOICE.lines.find((l) => l.id === id);
const VW = (id, w) => VL(id).words.find((x) => x.w.toLowerCase().startsWith(w)).t0;
const DURATION = onBeat(VOICE.duration);
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;

// ---- story events (seconds), all from the voice
const EV = {
  wave: VW('l1', 'медвеж'),             // Topa waves hello
  hearts: VW('l2', 'шарик'),            // hugs the balloon
  wind: VW('l3', 'подул'),              // the gust starts
  away: VW('l3', 'улетел'),             // the balloon breaks free
  run: VL('l3').t1 + 0.1,               // Topa runs to the tree
  cry: VW('l5', 'заплак'),
  rabbitIn: VW('l6', 'прискак'),
  jumps: [22.4, 23.75, 25.1],           // three jumps, each higher (the voice says them between 22 and 26s)
  rabbitSad: VW('l7', 'не'),
  hogIn: VW('l8', 'прибеж'),
  stumps: [VW('l8', 'горк'), VW('l8', 'горк') + 0.5, VW('l8', 'горк') + 1.0],
  climb: VW('l9', 'полез'),
  almost: VW('l9', 'почти'),
  no: VW('l9', 'нет'),
  down: VL('l9').t1 + 0.3,
  birdIn: VW('l10', 'прилет'),
  grab: VW('l11', 'ниточ'),
  lift: VL('l11').t1 + 0.1,             // the silence: the bird carries the balloon down
  land: onBeat(VL('l12').t1 + 0.2),     // THE PAYOFF: the balloon in Topa's paws (in the pause after the line)
  hooray: VW('l13', 'ура'),
  end: DURATION - 3.0,
};
// ---- the shot list: [t0, camera]. Cameras are defined in src/bridges.js
const SHOT_LIST = [
  [0.0, 'wide'],
  [onBeat(VL('l2').t0 - 0.3), 'bear'],
  [onBeat(VL('l3').t0 - 0.3), 'wide'],
  [onBeat(VL('l4').t0 - 0.4), 'top'],
  [onBeat(VL('l5').t0 - 0.3), 'bear'],
  [onBeat(VL('l6').t0 - 0.3), 'wide'],
  [onBeat(EV.rabbitSad - 0.3), 'rabbit'],
  [onBeat(VL('l8').t0 - 0.3), 'wide'],
  [onBeat(EV.almost - 0.3), 'reach'],
  [onBeat(EV.no + 0.6), 'wide'],
  [onBeat(EV.grab - 0.3), 'top'],
  [onBeat(VL('l12').t0 - 0.4), 'wide'],
  [EV.land, 'bear'],
  [onBeat(EV.hooray + 1.4), 'wide'],
];
const ERA_LIST = SHOT_LIST.map(([t0], i) => [t0, i + 1 < SHOT_LIST.length ? SHOT_LIST[i + 1][0] : DURATION, () => sceneMeadow()]);
const SHOTS = SHOT_LIST.map(([t0, cam], i) => [cam, i, t0, ERA_LIST[i][1], cam]);
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, gridOffset: GRID0, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE, aspect: FORMAT,
  format: 'beat-cut',
  shots: SHOTS.map(([key, era, t0, t1, title], i) => ({ id: i + 1, key, era, t0, t1, title })),
  cuts: SHOT_LIST.slice(1).map(([t0]) => t0),
  morphs: [],
  cues: EV,
  acts: [
    { name: '1 Полянка', role: 'build',   t0: 0.0, t1: onBeat(VL('l3').t0 - 0.3) },
    { name: '2 Беда',    role: 'journey', t0: onBeat(VL('l3').t0 - 0.3), t1: onBeat(VL('l10').t0 - 0.3) },
    { name: '3 Птичка',  role: 'peak',    t0: onBeat(VL('l10').t0 - 0.3), t1: onBeat(EV.lift) },
    { name: '4 Тишина',  role: 'silence', t0: onBeat(EV.lift), t1: EV.land },
    { name: '5 Ура',     role: 'gift',    t0: EV.land, t1: DURATION },
  ],
  board: [
    { t: 3.5, title: 'Топа на полянке', sound: 'весёлая мелодия, птицы', next: 'крупно: шарик' },
    { t: 7.6, title: 'красный шарик', sound: 'поп, сердечки', next: 'ветер' },
    { t: 11.9, title: 'ветер уносит шарик', sound: 'свист ветра', next: 'шарик на дереве' },
    { t: 15.5, title: 'шарик застрял', sound: 'грустная нота', next: 'Топа плачет' },
    { t: 18.3, title: 'Топа плачет', sound: 'капли', next: 'зайчик' },
    { t: 25.4, title: 'зайчик прыгает', sound: 'боинг', next: 'не достал' },
    { t: 32.8, title: 'горка из пеньков', sound: 'бум-бум', next: 'Топа лезет' },
    { t: 37.6, title: 'почти!', sound: 'нарастание', next: 'нет' },
    { t: 43.4, title: 'птичка', sound: 'чирик, крылья', next: 'берёт нитку' },
    { t: 45.4, title: 'нитка в клюве', sound: 'тишина', next: 'спуск' },
    { t: 51.5, title: 'шарик в лапах!', sound: 'аккорд, конфетти', next: 'танец' },
    { t: 58.0, title: 'все танцуют', sound: 'весёлый финал', next: 'конец' },
  ],
  narration: VOICE.lines.map((l) => ({ t0: l.t0, t1: l.t1, text: l.text })),
};
window.TIMELINE = TIMELINE;
